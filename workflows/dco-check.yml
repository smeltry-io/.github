name: DCO Check

on:
  pull_request:
    branches: ["*"]

jobs:
  dco:
    name: Verify DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO
        uses: tim-actions/dco@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
